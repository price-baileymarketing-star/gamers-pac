<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Studio Tax – The Arcade Game</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; min-height: 100vh; display: flex; justify-content: center; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const NEON = { blue:"#00CFFF", gold:"#FFD300", purple:"#CC44FF", red:"#FF3333" };
    const LINE_NAMES = { blue:"COMPLIANCE ZONE", gold:"RELIEF ZONE", purple:"STRATEGY ZONE", red:"SAFETY ZONE" };

    const NODES = [
      {id:0,x:80,y:160},{id:1,x:210,y:160},{id:2,x:360,y:160},{id:3,x:510,y:160},{id:4,x:660,y:160},{id:5,x:820,y:160},
      {id:6,x:80,y:300},{id:7,x:210,y:300},{id:8,x:360,y:300},{id:9,x:510,y:300},{id:10,x:660,y:300},{id:11,x:820,y:300},
      {id:12,x:80,y:440},{id:13,x:210,y:440},{id:14,x:360,y:440},{id:15,x:510,y:440},{id:16,x:660,y:440},{id:17,x:820,y:440},
      {id:18,x:80,y:575},{id:19,x:210,y:575},{id:20,x:360,y:575},{id:21,x:510,y:575},{id:22,x:660,y:575},{id:23,x:820,y:575},
      {id:24,x:210,y:230},{id:25,x:360,y:230},
      {id:26,x:210,y:370},{id:27,x:360,y:370},{id:28,x:510,y:370},{id:29,x:660,y:370},
      {id:30,x:210,y:508},{id:31,x:510,y:508},{id:32,x:660,y:508},
    ];

    const EDGES = [
      [0,1,"blue"],[1,2,"blue"],[2,3,"blue"],[3,4,"blue"],[4,5,"blue"],
      [6,7,"gold"],[7,8,"gold"],[8,9,"gold"],[9,10,"gold"],[10,11,"gold"],
      [12,13,"purple"],[13,14,"purple"],[14,15,"purple"],[15,16,"purple"],[16,17,"purple"],
      [18,19,"red"],[19,20,"red"],[20,21,"red"],[21,22,"red"],[22,23,"red"],
      [1,24,"blue"],[24,7,"gold"],
      [2,25,"blue"],[25,8,"gold"],
      [7,26,"gold"],[26,13,"purple"],
      [8,27,"gold"],[27,14,"purple"],
      [9,28,"gold"],[28,15,"purple"],
      [10,29,"gold"],[29,16,"purple"],
      [13,30,"purple"],[30,19,"red"],
      [15,31,"purple"],[31,21,"red"],
      [16,32,"purple"],[32,22,"red"],
    ];

    const SERVICES_DEF = [
      {nodeId:2,  label:"CORPORATION TAX",         zone:"blue",   tip:"COMPLIANCE UNLOCKED: Minimise liability & stay fully compliant!", isPower:false},
      {nodeId:4,  label:"VAT ADVISORY",             zone:"blue",   tip:"VAT SECURED: Digital sales & cross-border deals covered.",        isPower:false},
      {nodeId:5,  label:"PAYROLL & SHARE SCHEMES",  zone:"blue",   tip:"TALENT LOCKED IN: EMI schemes attract elite dev talent!",         isPower:false},
      {nodeId:8,  label:"VGTR / VGEC",              zone:"gold",   tip:"★ VGTR UNLOCKED: 25.5% Cash Back on Core Dev Costs!",            isPower:true },
      {nodeId:10, label:"R&D TAX RELIEF",           zone:"gold",   tip:"R&D RELIEF: Fueling your next build — up to 33p per £1!",        isPower:false},
      {nodeId:11, label:"GRANT FUNDING",            zone:"gold",   tip:"GRANTS ACTIVATED: Stack with R&D relief for max returns!",       isPower:false},
      {nodeId:14, label:"TAX PLANNING",             zone:"purple", tip:"STRATEGY ONLINE: Proactive planning = competitive advantage.",    isPower:false},
      {nodeId:16, label:"IP & ROYALTY STRUCTURE",   zone:"purple", tip:"IP SECURED: Reduce global tax on your royalty streams.",         isPower:false},
      {nodeId:17, label:"INTERNATIONAL TAX",        zone:"purple", tip:"GLOBAL MODE: Expand worldwide, zero tax surprises.",             isPower:false},
      {nodeId:21, label:"HMRC RISK MANAGEMENT",     zone:"red",    tip:"SHIELD EQUIPPED: HMRC enquiries deflected automatically!",       isPower:false},
    ];

    const GHOST_STARTS = [3, 9, 20];
    const CONSULTATION_URL = "https://www.pricebailey.co.uk/contact/";

    function getNeighbors(id) {
      return EDGES.flatMap(([a,b,l]) => a===id?[{id:b,line:l}]:b===id?[{id:a,line:l}]:[]);
    }
    function dirTo(from, to) {
      const dx=NODES[to].x-NODES[from].x, dy=NODES[to].y-NODES[from].y;
      return Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up");
    }
    function tubePath(n1,n2) {
      const {x:x1,y:y1}=n1,{x:x2,y:y2}=n2;
      if(x1===x2||y1===y2) return `M${x1},${y1}L${x2},${y2}`;
      const r=20,sx=x2>x1?1:-1,sy=y2>y1?1:-1;
      const ax=Math.abs(x2-x1),ay=Math.abs(y2-y1);
      if(ax>ay){const bx=x1+sx*ay;return `M${x1},${y1}L${bx-sx*r},${y1}Q${bx},${y1} ${bx},${y1+sy*r}L${x2},${y2}`;}
      else{const by=y1+sy*ax;return `M${x1},${y1}L${x1},${by-sy*r}Q${x1},${by} ${x1+sx*r},${by}L${x2},${y2}`;}
    }

    function makeAudio() {
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const play = fn => { try{ fn(ctx); }catch(e){} };
      const chomp = () => play(ctx => {
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.frequency.setValueAtTime(520,ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(220,ctx.currentTime+0.08);
        g.gain.setValueAtTime(0.18,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.1);
        o.start();o.stop(ctx.currentTime+0.1);
      });
      const powerUp = () => play(ctx => {
        [300,400,530,700,900,1200].forEach((f,i)=>{
          const o=ctx.createOscillator(),g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.type="square";o.frequency.value=f;
          const t=ctx.currentTime+i*0.09;
          g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.15,t+0.04);
          g.gain.linearRampToValueAtTime(0,t+0.09);
          o.start(t);o.stop(t+0.1);
        });
      });
      const death = () => play(ctx => {
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type="sawtooth";
        o.frequency.setValueAtTime(440,ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(60,ctx.currentTime+0.9);
        g.gain.setValueAtTime(0.25,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.9);
        o.start();o.stop(ctx.currentTime+0.95);
      });
      const shield = () => play(ctx => {
        [800,1000,1200,1000,800].forEach((f,i)=>{
          const o=ctx.createOscillator(),g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.type="sine";o.frequency.value=f;
          const t=ctx.currentTime+i*0.07;
          g.gain.setValueAtTime(0.15,t);g.gain.linearRampToValueAtTime(0,t+0.07);
          o.start(t);o.stop(t+0.08);
        });
      });
      const node = () => play(ctx => {
        [600,900,1200].forEach((f,i)=>{
          const o=ctx.createOscillator(),g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.frequency.value=f;
          const t=ctx.currentTime+i*0.1;
          g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
          o.start(t);o.stop(t+0.13);
        });
      });
      return {chomp,powerUp,death,shield,node};
    }

    function getPellets() {
      const pellets=[];
      EDGES.forEach(([a,b,line],ei)=>{
        const n1=NODES[a],n2=NODES[b];
        const dist=Math.hypot(n2.x-n1.x,n2.y-n1.y);
        const steps=Math.floor(dist/28);
        for(let i=1;i<steps;i++){
          const t=i/steps;
          pellets.push({id:`${ei}-${i}`,x:n1.x+(n2.x-n1.x)*t,y:n1.y+(n2.y-n1.y)*t,line,eaten:false});
        }
      });
      return pellets;
    }

    function App() {
      const [started,setStarted]=useState(false);
      const [playerNode,setPlayerNode]=useState(0);
      const [services,setServices]=useState(SERVICES_DEF.map(s=>({...s,collected:false})));
      const [pellets,setPellets]=useState(getPellets);
      const [score,setScore]=useState(0);
      const [hiScore,setHiScore]=useState(0);
      const [ghosts,setGhosts]=useState(GHOST_STARTS.map((n,i)=>({
        node:n,scared:false,
        color:[NEON.red,NEON.purple,NEON.gold][i],
        label:["HMRC","AUDITOR","INSPECTOR"][i],
      })));
      const [gameState,setGameState]=useState("idle");
      const [mouthOpen,setMouthOpen]=useState(true);
      const [facing,setFacing]=useState("right");
      const [powerUp,setPowerUp]=useState(false);
      const [popup,setPopup]=useState(null);
      const [riskManaged,setRiskManaged]=useState(false);
      const [deathMsg,setDeathMsg]=useState("GAME OVER");
      const [visitedEdges,setVisitedEdges]=useState(new Set());
      const audioRef=useRef(null);
      const powerTimer=useRef(null);
      const popupTimer=useRef(null);

      useEffect(()=>{const t=setInterval(()=>setMouthOpen(m=>!m),200);return()=>clearInterval(t);},[]);

      const startGame=()=>{
        audioRef.current=makeAudio();
        setStarted(true);setGameState("playing");
        setPlayerNode(0);setScore(0);setFacing("right");
        setServices(SERVICES_DEF.map(s=>({...s,collected:false})));
        setPellets(getPellets());
        setGhosts(GHOST_STARTS.map((n,i)=>({node:n,scared:false,color:[NEON.red,NEON.purple,NEON.gold][i],label:["HMRC","AUDITOR","INSPECTOR"][i]})));
        setPowerUp(false);setRiskManaged(false);setPopup(null);setVisitedEdges(new Set());
      };

      const showPopup=txt=>{
        if(popupTimer.current)clearTimeout(popupTimer.current);
        setPopup(txt);
        popupTimer.current=setTimeout(()=>setPopup(null),2600);
      };

      const movePlayer=useCallback(dir=>{
        if(gameState!=="playing")return;
        const nb=getNeighbors(playerNode);
        const cands=nb.filter(n=>dirTo(playerNode,n.id)===dir);
        if(!cands.length)return;
        const target=cands[0];
        setFacing(dir);
        const eKey=[Math.min(playerNode,target.id),Math.max(playerNode,target.id)].join("-");
        setVisitedEdges(prev=>new Set([...prev,eKey]));
        setPlayerNode(target.id);
        setPellets(prev=>prev.map(p=>{
          const dist=Math.hypot(p.x-NODES[target.id].x,p.y-NODES[target.id].y);
          if(!p.eaten&&dist<22){audioRef.current?.chomp();setScore(s=>s+10);return{...p,eaten:true};}
          return p;
        }));
        setServices(prev=>prev.map(s=>{
          if(s.nodeId===target.id&&!s.collected){
            setScore(sc=>sc+(s.isPower?500:150));
            showPopup(s.tip);
            if(s.isPower){
              audioRef.current?.powerUp();
              setPowerUp(true);
              if(powerTimer.current)clearTimeout(powerTimer.current);
              setGhosts(g=>g.map(gh=>({...gh,scared:true})));
              powerTimer.current=setTimeout(()=>{setPowerUp(false);setGhosts(g=>g.map(gh=>({...gh,scared:false})));},8000);
            } else {audioRef.current?.node();}
            if(s.label.includes("RISK"))setRiskManaged(true);
            return{...s,collected:true};
          }
          return s;
        }));
      },[playerNode,gameState]);

      useEffect(()=>{
        const h=e=>{const m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(m[e.key]){e.preventDefault();movePlayer(m[e.key]);}};
        window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
      },[movePlayer]);

      useEffect(()=>{
        if(gameState!=="playing")return;
        const t=setInterval(()=>setGhosts(prev=>prev.map(g=>{const nb=getNeighbors(g.node);return{...g,node:nb[Math.floor(Math.random()*nb.length)].id};})),880);
        return()=>clearInterval(t);
      },[gameState]);

      useEffect(()=>{
        if(gameState!=="playing")return;
        for(const g of ghosts){
          if(g.node===playerNode){
            if(powerUp){
              setScore(s=>s+300);audioRef.current?.node();
              setGhosts(prev=>prev.map((gh,i)=>gh.node===g.node?{...gh,node:GHOST_STARTS[i],scared:false}:gh));
            } else if(g.label==="HMRC"&&riskManaged){
              audioRef.current?.shield();showPopup("🛡️ RISK MANAGED! HMRC enquiry blocked!");
            } else {
              audioRef.current?.death();
              setDeathMsg(g.label==="HMRC"?"HMRC ENQUIRY STRUCK!\nCollect Risk Management first.":`INSPECTOR CAUGHT YOU!`);
              setGameState("dead");setHiScore(h=>Math.max(h,score));
            }
          }
        }
        if(services.every(s=>s.collected)){setGameState("won");setHiScore(h=>Math.max(h,score));}
      },[playerNode,ghosts,powerUp,riskManaged,services,gameState,score]);

      const W=940,H=660;
      const lc=k=>NEON[k]||"#fff";
      const mono="'Arial Black','Impact','Courier New',monospace";
      const ui="'Courier New',monospace";

      const DBtn=({dir,label})=>(
        <button onPointerDown={e=>{e.preventDefault();movePlayer(dir);}}
          style={{width:52,height:52,background:"#111",border:"2px solid #333",borderRadius:8,
            color:"#fff",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",
            justifyContent:"center",userSelect:"none",WebkitUserSelect:"none",touchAction:"none",
            boxShadow:"0 0 8px #ffffff22"}}>{label}</button>
      );

      return (
        <div style={{background:"#000",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",padding:"10px",fontFamily:ui,userSelect:"none"}}>

          {/* HUD */}
          <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:8,width:W,flexWrap:"wrap"}}>
            <div style={{color:NEON.gold,fontWeight:900,fontSize:17,letterSpacing:2,textShadow:`0 0 10px ${NEON.gold}`}}>STUDIO TAX</div>
            <div style={{color:"#fff",fontSize:13,letterSpacing:1}}>SCORE: <span style={{color:NEON.gold,fontWeight:700}}>{score}</span></div>
            <div style={{color:"#aaa",fontSize:13,letterSpacing:1}}>HI: <span style={{color:NEON.purple,fontWeight:700}}>{hiScore}</span></div>
            <div style={{color:"#aaa",fontSize:12}}>{services.filter(s=>s.collected).length}/10 NODES</div>
            {powerUp&&<div style={{color:"#000",background:NEON.gold,padding:"2px 10px",borderRadius:4,fontWeight:900,fontSize:12,animation:"blink 0.4s step-end infinite"}}>★ VGTR POWER MODE</div>}
            {riskManaged&&<div style={{color:NEON.blue,fontSize:12,letterSpacing:1}}>🛡 RISK MANAGED</div>}
          </div>

          <div style={{position:"relative",width:W,height:H,background:"#000",borderRadius:16,border:"2px solid #222",overflow:"hidden",boxShadow:"0 0 40px #000"}}>
            <svg width={W} height={H} style={{position:"absolute",top:0,left:0}}>
              <defs>
                {Object.entries(NEON).map(([k,c])=>(
                  <filter key={k} id={`glow-${k}`} x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                ))}
                <filter id="glow-white" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
                  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>

              {/* Zone labels */}
              {[{y:160,line:"blue"},{y:300,line:"gold"},{y:440,line:"purple"},{y:575,line:"red"}].map(({y,line})=>(
                <text key={line} x={22} y={y-14} fontSize={9} fill={lc(line)} fontFamily={ui}
                  fontWeight="900" letterSpacing="2" opacity={0.7} filter={`url(#glow-${line})`}>{LINE_NAMES[line]}</text>
              ))}

              {/* Tube lines */}
              {EDGES.map(([a,b,line],i)=>{
                const d=tubePath(NODES[a],NODES[b]);
                const col=lc(line);
                const k=[Math.min(a,b),Math.max(a,b)].join("-");
                const vis=visitedEdges.has(k);
                return(
                  <g key={i}>
                    <path d={d} fill="none" stroke={col} strokeWidth={12} strokeOpacity={0.12} strokeLinecap="round"/>
                    <path d={d} fill="none" stroke={col} strokeWidth={vis?2:4} strokeOpacity={vis?0.2:0.9} strokeLinecap="round" filter={vis?"none":`url(#glow-${line})`}/>
                  </g>
                );
              })}

              {/* Pellets */}
              {pellets.map(p=>!p.eaten&&(
                <circle key={p.id} cx={p.x} cy={p.y} r={3} fill={lc(p.line)} opacity={0.8} filter={`url(#glow-${p.line})`}/>
              ))}

              {/* Station dots */}
              {NODES.map((n,i)=>{
                const nodeLines=[...new Set(EDGES.filter(([a,b])=>a===i||b===i).map(([,,l])=>l))];
                const isInter=i>=24;
                return isInter?(
                  <g key={i}>
                    <rect x={n.x-8} y={n.y-8} width={16} height={16} rx={2} fill="#000" stroke="#444" strokeWidth={1.5}/>
                    {nodeLines.map((l,li)=>(
                      <line key={li} x1={n.x-5+li*5} y1={n.y-5} x2={n.x-5+li*5} y2={n.y+5} stroke={lc(l)} strokeWidth={2.5} strokeLinecap="round"/>
                    ))}
                  </g>
                ):(
                  <circle key={i} cx={n.x} cy={n.y} r={5} fill="#000" stroke={nodeLines[0]?lc(nodeLines[0]):"#444"} strokeWidth={2}/>
                );
              })}

              {/* Service nodes — solid filled, high-contrast black text */}
              {services.map((s,i)=>{
                if(s.collected)return null;
                const n=NODES[s.nodeId],col=lc(s.zone);
                const isPow=s.isPower,r=isPow?34:28;
                const words=s.label.split(" "),mid=Math.ceil(words.length/2);
                const line1=words.slice(0,mid).join(" "),line2=words.slice(mid).join(" ");
                return(
                  <g key={i}>
                    {isPow&&<circle cx={n.x} cy={n.y} r={r+8} fill="none" stroke={col} strokeWidth={1.5} opacity={0.35} filter={`url(#glow-${s.zone})`}/>}
                    <circle cx={n.x} cy={n.y} r={r} fill={col} stroke={col} strokeWidth={3} filter={`url(#glow-${s.zone})`}/>
                    <circle cx={n.x} cy={n.y} r={r-3} fill={col} stroke="rgba(0,0,0,0.25)" strokeWidth={1}/>
                    <text x={n.x} y={line2?n.y-4:n.y+4} textAnchor="middle" fill="#000" fontSize={isPow?9.5:9} fontWeight="900" fontFamily={mono} letterSpacing="0.3">{line1}</text>
                    {line2&&<text x={n.x} y={n.y+9} textAnchor="middle" fill="#000" fontSize={isPow?9.5:9} fontWeight="900" fontFamily={mono} letterSpacing="0.3">{line2}</text>}
                    {isPow&&<text x={n.x} y={n.y+r-4} textAnchor="middle" fill="#000" fontSize={11} fontWeight="900">★</text>}
                  </g>
                );
              })}

              {/* Ghosts */}
              {ghosts.map((g,i)=>{
                const n=NODES[g.node],col=g.scared?"#0044ff":g.color;
                const gk=g.scared?"blue":["red","purple","gold"][i];
                return(
                  <g key={i} filter={`url(#glow-${gk})`}>
                    <ellipse cx={n.x} cy={n.y} rx={13} ry={15} fill={col} opacity={0.92}/>
                    <rect x={n.x-13} y={n.y-4} width={26} height={10} fill={col} opacity={0.92}/>
                    <path d={`M${n.x-13},${n.y+10} Q${n.x-9},${n.y+17} ${n.x-4},${n.y+10} Q${n.x+1},${n.y+17} ${n.x+6},${n.y+10} Q${n.x+10},${n.y+17} ${n.x+13},${n.y+10}`} fill={col}/>
                    <circle cx={n.x-4} cy={n.y-4} r={3} fill="white"/>
                    <circle cx={n.x+4} cy={n.y-4} r={3} fill="white"/>
                    <circle cx={n.x-4} cy={n.y-4} r={1.5} fill={g.scared?"#4488ff":"#111"}/>
                    <circle cx={n.x+4} cy={n.y-4} r={1.5} fill={g.scared?"#4488ff":"#111"}/>
                    <text x={n.x} y={n.y-20} textAnchor="middle" fontSize={7.5} fontWeight="900" fill={col} fontFamily={ui} filter={`url(#glow-${gk})`}>{g.label}</text>
                  </g>
                );
              })}

              {/* Player */}
              {(()=>{
                const n=NODES[playerNode];
                const ang={right:0,left:180,up:270,down:90}[facing];
                const m=mouthOpen?35:5,r=15;
                const s1=(ang+m)*Math.PI/180,e1=(ang+360-m)*Math.PI/180;
                const px1=n.x+r*Math.cos(s1),py1=n.y+r*Math.sin(s1);
                const px2=n.x+r*Math.cos(e1),py2=n.y+r*Math.sin(e1);
                const eyeA=(ang-65)*Math.PI/180;
                return(
                  <g filter="url(#glow-white)">
                    {powerUp&&<circle cx={n.x} cy={n.y} r={26} fill={NEON.gold} opacity={0.18}/>}
                    <path d={`M${n.x},${n.y} L${px1},${py1} A${r},${r} 0 1,1 ${px2},${py2} Z`}
                      fill={powerUp?"#ff9900":NEON.gold} stroke={powerUp?"#ff6600":"#cc9900"} strokeWidth={1}/>
                    <circle cx={n.x+r*0.35*Math.cos(eyeA)} cy={n.y+r*0.35*Math.sin(eyeA)} r={2} fill="#000"/>
                  </g>
                );
              })()}
            </svg>

            {/* Popup */}
            {popup&&(
              <div style={{position:"absolute",top:12,left:"50%",transform:"translateX(-50%)",
                background:"#000",color:NEON.gold,border:`2px solid ${NEON.gold}`,borderRadius:10,
                padding:"10px 20px",fontSize:13,fontWeight:900,letterSpacing:1,
                boxShadow:`0 0 24px ${NEON.gold}88`,maxWidth:360,textAlign:"center",fontFamily:ui,zIndex:20}}>
                {popup}
              </div>
            )}

            {/* Checklist */}
            <div style={{position:"absolute",top:10,right:10,background:"rgba(0,0,0,0.9)",border:"1px solid #333",borderRadius:10,padding:"8px 12px",minWidth:160}}>
              <div style={{fontSize:9,color:"#666",marginBottom:5,letterSpacing:2,fontFamily:ui}}>NODES COLLECTED</div>
              {services.map((s,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:lc(s.zone),opacity:s.collected?1:0.2,boxShadow:s.collected?`0 0 6px ${lc(s.zone)}`:"none",flexShrink:0}}/>
                  <span style={{fontSize:9.5,color:s.collected?lc(s.zone):"#444",fontWeight:s.collected?700:400,fontFamily:ui,letterSpacing:0.5}}>
                    {s.label.length>18?s.label.slice(0,17)+"…":s.label}
                  </span>
                  {s.collected&&<span style={{color:"#00ff88",fontSize:9,marginLeft:"auto"}}>✓</span>}
                </div>
              ))}
            </div>

            {/* Legend */}
            <div style={{position:"absolute",bottom:10,left:10,background:"rgba(0,0,0,0.85)",border:"1px solid #222",borderRadius:8,padding:"7px 12px"}}>
              {Object.entries(NEON).map(([k,c])=>(
                <div key={k} style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                  <div style={{width:24,height:4,borderRadius:2,background:c,boxShadow:`0 0 6px ${c}`}}/>
                  <span style={{fontSize:9,color:c,fontFamily:ui,fontWeight:700,letterSpacing:1}}>{LINE_NAMES[k]}</span>
                </div>
              ))}
              <div style={{display:"flex",alignItems:"center",gap:7,marginTop:2}}>
                <span style={{fontSize:12}}>⭐</span>
                <span style={{fontSize:9,color:"#aaa",fontFamily:ui}}>VGTR Power-Up (8s)</span>
              </div>
            </div>

            {/* Start screen */}
            {!started&&(
              <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.97)"}}>
                <div style={{fontSize:36,fontWeight:900,color:NEON.gold,letterSpacing:4,textShadow:`0 0 30px ${NEON.gold}`,marginBottom:8,fontFamily:ui}}>STUDIO TAX</div>
                <div style={{color:NEON.blue,fontSize:14,letterSpacing:3,marginBottom:4,fontFamily:ui}}>THE ARCADE GAME</div>
                <div style={{color:"#555",fontSize:11,marginBottom:30,fontFamily:ui}}>COLLECT ALL 10 TAX SERVICES · AVOID THE INSPECTORS</div>
                <div style={{display:"flex",gap:20,marginBottom:28,flexWrap:"wrap",justifyContent:"center"}}>
                  {Object.entries(NEON).map(([k,c])=>(
                    <div key={k} style={{display:"flex",alignItems:"center",gap:6}}>
                      <div style={{width:20,height:4,background:c,borderRadius:2,boxShadow:`0 0 8px ${c}`}}/>
                      <span style={{color:c,fontSize:10,fontFamily:ui}}>{LINE_NAMES[k]}</span>
                    </div>
                  ))}
                </div>
                <button onClick={startGame} style={{background:NEON.gold,color:"#000",border:"none",borderRadius:8,padding:"14px 40px",fontWeight:900,fontSize:18,cursor:"pointer",fontFamily:ui,letterSpacing:2,boxShadow:`0 0 30px ${NEON.gold}`,marginBottom:12}}>
                  ▶ START GAME
                </button>
                <div style={{color:"#444",fontSize:10,fontFamily:ui}}>Arrow keys to move · Collect ★ VGTR for power-up</div>
              </div>
            )}

            {/* Win screen */}
            {gameState==="won"&&(
              <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"radial-gradient(ellipse at center,#0a0020 0%,#000 70%)"}}>
                <div style={{fontSize:52,marginBottom:8}}>🏆</div>
                <div style={{fontSize:22,fontWeight:900,color:NEON.gold,letterSpacing:3,textShadow:`0 0 20px ${NEON.gold}`,fontFamily:ui,marginBottom:4,textAlign:"center",padding:"0 20px"}}>TAX POSITION: OPTIMISED</div>
                <div style={{color:"#aaa",fontSize:13,marginBottom:4,fontFamily:ui}}>FINAL SCORE: <span style={{color:NEON.gold,fontWeight:900}}>{score}</span></div>
                <div style={{color:NEON.blue,fontSize:12,marginBottom:6,fontFamily:ui}}>HI SCORE: {hiScore}</div>
                <div style={{color:"#666",fontSize:12,textAlign:"center",padding:"0 60px",marginBottom:24,fontFamily:ui}}>
                  You've unlocked your studio's full tax potential.<br/>Ready to play for real?
                </div>
                <a href={CONSULTATION_URL} target="_blank" rel="noopener noreferrer"
                  style={{background:NEON.gold,color:"#000",fontWeight:900,fontSize:17,padding:"14px 36px",borderRadius:8,textDecoration:"none",fontFamily:ui,letterSpacing:2,boxShadow:`0 0 30px ${NEON.gold}88`,marginBottom:14,display:"block",textAlign:"center"}}>
                  📅 BOOK A CONSULTATION
                </a>
                <button onClick={startGame} style={{background:"none",border:"1px solid #333",color:"#555",borderRadius:6,padding:"8px 20px",cursor:"pointer",fontFamily:ui,fontSize:11}}>
                  PLAY AGAIN
                </button>
              </div>
            )}

            {/* Dead screen */}
            {gameState==="dead"&&(
              <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.93)"}}>
                <div style={{fontSize:48,marginBottom:8}}>💀</div>
                <div style={{fontSize:20,fontWeight:900,color:NEON.red,letterSpacing:3,textAlign:"center",fontFamily:ui,whiteSpace:"pre-line",marginBottom:8,textShadow:`0 0 20px ${NEON.red}`,padding:"0 40px"}}>{deathMsg}</div>
                <div style={{color:"#666",fontSize:13,marginBottom:20,fontFamily:ui}}>SCORE: {score}</div>
                <button onClick={startGame} style={{background:NEON.red,color:"#000",border:"none",borderRadius:8,padding:"12px 32px",fontWeight:900,fontSize:16,cursor:"pointer",fontFamily:ui,letterSpacing:2,boxShadow:`0 0 20px ${NEON.red}88`}}>
                  TRY AGAIN
                </button>
              </div>
            )}
          </div>

          {/* D-Pad */}
          <div style={{marginTop:14,display:"grid",gridTemplateColumns:"52px 52px 52px",gridTemplateRows:"52px 52px 52px",gap:4}}>
            <div/><DBtn dir="up" label="▲"/><div/>
            <DBtn dir="left" label="◀"/>
            <div style={{width:52,height:52,background:"#0a0a0a",borderRadius:8,border:"1px solid #1a1a1a"}}/>
            <DBtn dir="right" label="▶"/>
            <div/><DBtn dir="down" label="▼"/><div/>
          </div>
          <div style={{marginTop:6,color:"#333",fontSize:10,fontFamily:ui,letterSpacing:1}}>
            KEYBOARD ← ↑ ↓ → · D-PAD FOR MOBILE
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
