<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>PB Man</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* FIXED: Locked body to prevent internal bounces */
html,body{background:#000;height:100%;display:flex;justify-content:center;overflow:hidden;width:100%;touch-action:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
#root { width: 100%; height: 100%; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;
const NEON={green:"#00C853",orange:"#FF6D00",purple:"#CC44FF",gray:"#90A4AE"};
const YELLOW="#FFD300";
const LN={green:"TAX FOR BUSINESS",orange:"OUTSOURCING",purple:"M&A ADVISORY",gray:"BUSINESS ADVISORY"};
const ND=[
{id:0,x:80,y:160},{id:1,x:210,y:160},{id:2,x:360,y:160},{id:3,x:510,y:160},{id:4,x:660,y:160},{id:5,x:820,y:160},
{id:6,x:80,y:300},{id:7,x:210,y:300},{id:8,x:360,y:300},{id:9,x:510,y:300},{id:10,x:660,y:300},{id:11,x:820,y:300},
{id:12,x:80,y:440},{id:13,x:210,y:440},{id:14,x:360,y:440},{id:15,x:510,y:440},{id:16,x:660,y:440},{id:17,x:820,y:440},
{id:18,x:80,y:575},{id:19,x:210,y:575},{id:20,x:360,y:575},{id:21,x:510,y:575},{id:22,x:660,y:575},{id:23,x:820,y:575},
{id:24,x:210,y:230},{id:25,x:360,y:230},{id:26,x:210,y:370},{id:27,x:360,y:370},
{id:28,x:510,y:370},{id:29,x:660,y:370},{id:30,x:210,y:508},{id:31,x:510,y:508},{id:32,x:660,y:508},{id:33,x:510,y:230}
];
const ED=[
[0,1,"green"],[1,2,"green"],[2,3,"green"],[3,4,"green"],[4,5,"green"],
[6,7,"orange"],[7,8,"orange"],[8,9,"orange"],[9,10,"orange"],[10,11,"orange"],
[12,13,"purple"],[13,14,"purple"],[14,15,"purple"],[15,16,"purple"],[16,17,"purple"],
[18,19,"gray"],[19,20,"gray"],[20,21,"gray"],[21,22,"gray"],[22,23,"gray"],
[1,24,"green"],[24,7,"orange"],[2,25,"green"],[25,8,"orange"],
[3,33,"green"],[33,9,"orange"],[9,28,"orange"],[28,15,"purple"],
[7,26,"orange"],[26,13,"purple"],[8,27,"orange"],[27,14,"purple"],
[10,29,"orange"],[29,16,"purple"],[13,30,"purple"],[30,19,"gray"],
[15,31,"purple"],[31,21,"gray"],[16,32,"purple"],[32,22,"gray"]
];
const SV=[
{n:2,l:"CORPORATION TAX",z:"green",t:"COMPLIANCE UNLOCKED!",pw:false},
{n:4,l:"R&D TAX RELIEF",z:"green",t:"R&D RELIEF: Up to 33p per £1!",pw:true},
{n:3,l:"EOT",z:"green",t:"EOT UNLOCKED: Tax-efficient exit!",pw:false,eot:true},
{n:5,l:"VGTR / VGEC",z:"green",t:"★ POWER UP: 25.5% Cash Back!",pw:false},
{n:8,l:"PAYROLL",z:"orange",t:"PAYROLL SECURED.",pw:false},
{n:10,l:"EMPLOYMENT LAW",z:"orange",t:"EMPLOYMENT LAW: Stay protected.",pw:false},
{n:14,l:"VALUATIONS GROWTH",z:"purple",t:"VALUATIONS: Know your worth.",pw:false},
{n:16,l:"SHARE OPTIONS",z:"purple",t:"SHARE OPTIONS: Incentivise your team.",pw:false},
{n:15,l:"EOT",z:"purple",t:"EOT: Rewarding your people.",pw:false,eot:true},
{n:20,l:"FORECASTING & BUDGETING",z:"gray",t:"FORECASTING: Plan ahead.",pw:false},
{n:22,l:"RAISING FUNDS",z:"gray",t:"RAISING FUNDS: Prepare your case.",pw:false}
];
const GS=[1,9,19,13];
const GD=[
{color:NEON.orange,label:"TAX INVESTIGATION"},
{color:"#FF69B4",label:"HIGH INFLATION"},
{color:NEON.purple,label:"R&D ENQUIRY"},
{color:"#FF3333",label:"EMPLOYERS NI"}
];
const lc=k=>NEON[k]||"#fff";
const ui="'Courier New',monospace";
const mn="'Arial Black','Arial',sans-serif";

function nb(id){return ED.flatMap(([a,b,l])=>a===id?[{id:b,line:l}]:b===id?[{id:a,line:l}]:[]);}
function dr(f,t){const dx=ND[t].x-ND[f].x,dy=ND[t].y-ND[f].y;return Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up");}
function tp(n1,n2){
  const{x:x1,y:y1}=n1,{x:x2,y:y2}=n2;
  if(x1===x2||y1===y2)return`M${x1},${y1}L${x2},${y2}`;
  const r=20,sx=x2>x1?1:-1,sy=y2>y1?1:-1,ax=Math.abs(x2-x1),ay=Math.abs(y2-y1);
  if(ax>ay){const bx=x1+sx*ay;return`M${x1},${y1}L${bx-sx*r},${y1}Q${bx},${y1} ${bx},${y1+sy*r}L${x2},${y2}`;}
  else{const by=y1+sy*ax;return`M${x1},${y1}L${x1},${by-sy*r}Q${x1},${by} ${x1+sx*r},${by}L${x2},${y2}`;}
}
function gp(){
  const p=[];
  ED.forEach(([a,b,line],ei)=>{
    const n1=ND[a],n2=ND[b],d=Math.hypot(n2.x-n1.x,n2.y-n1.y),s=Math.floor(d/28);
    for(let i=1;i<s;i++){const t=i/s;p.push({id:`${ei}-${i}`,x:n1.x+(n2.x-n1.x)*t,y:n1.y+(n2.y-n1.y)*t,line,eaten:false});}
  });return p;
}

function App(){
  const[started,setStarted]=useState(false);
  const[pn,setPn]=useState(0);
  const[svcs,setSvcs]=useState(SV.map(s=>({...s,collected:false})));
  const[pels,setPels]=useState(gp);
  const[score,setScore]=useState(0);
  const[hi,setHi]=useState(0);
  const[ghosts,setGhosts]=useState(GS.map((n,i)=>({...GD[i],node:n,scared:false})));
  const[gs,setGs]=useState("idle");
  const[mo,setMo]=useState(true);
  const[face,setFace]=useState("right");
  const[pu,setPu]=useState(false);
  const[pop,setPop]=useState(null);
  const[ve,setVe]=useState(new Set());
  const[slb,setSlb]=useState(false);
  const[fs,setFs]=useState(0);
  const[bd,setBd]=useState([]);
  const[sv2,setSv2]=useState(false);
  const ppt=useRef(null);

  useEffect(()=>{const t=setInterval(()=>setMo(m=>!m),200);return()=>clearInterval(t)},[]);

  const start=()=>{
    setStarted(true);setGs("playing");setSlb(false);setSv2(false);
    setPn(0);setScore(0);setFace("right");
    setSvcs(SV.map(s=>({...s,collected:false})));
    setPels(gp());setGhosts(GS.map((n,i)=>({...GD[i],node:n,scared:false})));
    setPu(false);setPop(null);setVe(new Set());
  };

  const end=(won,sc)=>{setFs(sc);setHi(h=>Math.max(h,sc));setGs(won?"won":"dead");};
  const showPop=txt=>{if(ppt.current)clearTimeout(ppt.current);setPop(txt);ppt.current=setTimeout(()=>setPop(null),2600);};

  const move=useCallback(dir=>{
    if(gs!=="playing")return;
    const nbs=nb(pn);const cands=nbs.filter(n=>dr(pn,n.id)===dir);
    if(!cands.length)return;
    const tgt=cands[0];setFace(dir);
    const ek=[Math.min(pn,tgt.id),Math.max(pn,tgt.id)].join("-");
    setVe(prev=>new Set([...prev,ek]));setPn(tgt.id);
    setPels(prev=>prev.map(p=>{
      if(!p.eaten&&Math.hypot(p.x-ND[tgt.id].x,p.y-ND[tgt.id].y)<22){setScore(s=>s+10);return{...p,eaten:true}}return p;
    }));
    setSvcs(prev=>prev.map(s=>{
      if(s.n===tgt.id&&!s.collected){
        const pts=s.pw?500:150;setScore(sc=>sc+pts);showPop(s.t);
        if(s.pw){setPu(true);setGhosts(g=>g.map(gh=>({...gh,scared:true})));setTimeout(()=>{setPu(false);setGhosts(g=>g.map(gh=>({...gh,scared:false})))},8000);}
        return{...s,collected:true};
      }return s;
    }));
  },[pn,gs]);

  useEffect(()=>{
    const h=e=>{
      const m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
      if(m[e.key]){
        // FIXED: Explicitly stop parent window from scrolling
        e.preventDefault();
        move(m[e.key]);
      }
    };
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[move]);

  useEffect(()=>{if(gs!=="playing")return;const t=setInterval(()=>setGhosts(prev=>prev.map(g=>{const nbs=nb(g.node);return{...g,node:nbs[Math.floor(Math.random()*nbs.length)].id}})),880);return()=>clearInterval(t)},[gs]);

  useEffect(()=>{
    if(gs!=="playing")return;
    for(const g of ghosts){
      if(g.node===pn){
        if(pu){setScore(s=>s+300);setGhosts(prev=>prev.map((gh,i)=>gh.node===g.node?{...GD[i],node:GS[i],scared:false}:gh));}
        else{setScore(sc=>{setTimeout(()=>end(false,sc),100);return sc});}
      }
    }
    if(svcs.every(s=>s.collected)){setScore(sc=>{setTimeout(()=>end(true,sc),100);return sc});}
  },[pn,ghosts,pu,svcs,gs]);

  const W=940,H=660;
  const DB=({dir,label})=>(
    <button onPointerDown={e=>{e.preventDefault();move(dir)}}
      style={{width:52,height:52,background:"#111",border:"2px solid #333",borderRadius:8,color:"#fff",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",touchAction:"none"}}>{label}</button>
  );

  return(
    <div style={{background:"#000",height:"100%",display:"flex",flexDirection:"column",alignItems:"center",padding:"10px",fontFamily:ui,userSelect:"none", width: "100%", overflow: "hidden"}}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:8,width:"100%",maxWidth:W,flexWrap:"wrap"}}>
        <div style={{color:NEON.green,fontWeight:900,fontSize:17}}>PB MAN</div>
        <div style={{color:"#fff",fontSize:13}}>SCORE: {score}</div>
        <div style={{color:"#aaa",fontSize:13}}>HI: {hi}</div>
      </div>

      <div style={{position:"relative",width:"100%",maxWidth:W,background:"#000",borderRadius:16,border:"2px solid #222",overflow:"hidden", flex: 1}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{display:"block",width:"100%",height:"100%"}}>
          {ED.map(([a,b,line],i)=>{
            const d=tp(ND[a],ND[b]),col=lc(line),vis=ve.has([Math.min(a,b),Math.max(a,b)].join("-"));
            return(<g key={i}><path d={d} fill="none" stroke={col} strokeWidth={4} strokeOpacity={vis?.2:.9} strokeLinecap="round"/></g>);
          })}
          {pels.map(p=>!p.eaten&&<circle key={p.id} cx={p.x} cy={p.y} r={3} fill={lc(p.line)} />)}
          {ND.map((n,i)=><circle key={i} cx={n.x} cy={n.y} r={5} fill="#000" stroke="#444" strokeWidth={2}/>)}
          {svcs.map((s,i)=>{
            if(s.collected)return null;
            const n=ND[s.n],col=lc(s.z);
            return(<rect key={i} x={n.x-48} y={n.y-19} width={96} height={38} rx={8} fill={col} />);
          })}
          {ghosts.map((g,i)=>{
            const n=ND[g.node],col=g.scared?"#0044ff":g.color;
            return(<circle key={i} cx={n.x} cy={n.y} r={14} fill={col} />);
          })}
          <circle cx={ND[pn].x} cy={ND[pn].y} r={18} fill={pu?"#ff9900":NEON.green}/>
        </svg>
        {!started&&(
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"#000"}}>
            <button onClick={start} style={{background:NEON.green,color:"#000",padding:"14px 40px",fontWeight:900,fontSize:18,cursor:"pointer",borderRadius:8}}>▶ START GAME</button>
          </div>
        )}
      </div>
      
      <div style={{marginTop:14,display:"grid",gridTemplateColumns:"52px 52px 52px",gap:4}}>
        <div/><DB dir="up" label="▲"/><div/>
        <DB dir="left" label="◀"/><div/><DB dir="right" label="▶"/>
        <div/><DB dir="down" label="▼"/><div/>
      </div>
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
